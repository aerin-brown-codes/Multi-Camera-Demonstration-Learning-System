scene: tabletop             # sim/scenes/<scene>.xml; `--scene cube_hands` on sim.run overrides it.
                            # The calibration scripts read this too and need the board, which only tabletop has.
rig: rig.yaml               # relative to this file

feed:
  host: 127.0.0.1           # 0.0.0.0 to let another machine subscribe (e.g. the Ubuntu box later)
  port: 5555
  queue_messages: 26        # ZMQ high-water mark, 2 frames of 4 cameras (3 messages each) + truth; a reader that
                            # falls behind loses messages, like a real camera

# Scenes that list poses in configs/scenes/<scene>.yaml are placed, not simulated.
pose_hold_s: 3.0            # how long the live feed shows each pose before moving to the next
allowed_overlap_m: 0.002    # a pose is refused if a hand, the cube or the table sink into each other deeper
                            # than this. Not zero, because shapes that only touch report a tiny overlap.

# Scenes that list targets in configs/scenes/<scene>.yaml get an exact box per target and camera in the
# truth message. A box is always reported; it "counts" (is a training label, is scored) when both hold.
truth_boxes:
  min_visible_fraction: 0.10  # visible pixels / pixels with nothing in the way. The BOP benchmark's cut-off.
  min_box_side_px: 8          # shorter side of the box. Our own pick; the 5 cm cube is about 50 px here.

speed_warn_below: 0.95      # print when the sim runs slower than this fraction of real time
speed_report_s: 2.0         # how often to check

view:
  depth_display_m: [0.5, 1.5]   # depth colour scale over the work area: near = red, far = blue/purple, no reading = black
  scale: 0.5                    # shrink tiles so 4 cameras fit on a laptop screen
