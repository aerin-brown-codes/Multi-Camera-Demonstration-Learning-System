# Everything sim/dataset.py needs to write the labelled training images (docs/phase-2/03-dataset.md).
# Lengths in metres, angles in degrees, colours 0 to 1. [low, high] is a range drawn from evenly.
# Shares (scene_kinds, sparse, patterns) must add up to 1.

sim_config: sim.yaml          # relative to this file: the rig file, the overlap allowance, the box limits
scene: cube_hands             # scenes/<scene>.xml with its configs/scenes/<scene>.yaml (poses, targets)
camera_profile: d435          # a profile in the rig file
table_geom: table
floor_geom: floor

sets:                         # scene N of a set is made from that set's seed and N alone
  train: {images: 5000, seed: 1}
  check: {images: 500,  seed: 2}     # the training tool watches these to decide when to stop
  test:  {images: 1000, seed: 3}     # the score we report. Generate once, then leave it alone.
cameras_per_scene: 4
class_ids: {hand: 0, cube: 1}        # first number of a label line

progress_every_s: 10          # how often a run prints where it is

extras_tries: 100             # times the extra objects that sink into something are put somewhere else; the pose stays
camera_tries: 20              # redraws of one camera until a target counts in its image (sparse scenes keep the first)

scene_kinds: {interaction: 0.6, random: 0.3, sparse: 0.1}

cameras:
  distance_m: [0.4, 1.5]      # from the point on the table top the camera aims at
  height_deg: [10, 90]        # above the table top, from any side; 90 looks straight down

poses:
  tries: 2000                 # draws of one pose, each checked for overlaps, before giving up
  allowed_self_overlap_m: 0.002         # a hand whose fingers sink into each other deeper than this is redrawn
  table_margin_m: 0.05        # cubes, palms and the centre of a group land at least this far inside the table edge
  mirror_chance: 0.5          # how often a hand-written pose is flipped left to right
  held_cube_lift_m: [0.0, 0.30]         # a held cube's centre above where it rests
  sparse: {empty: 0.2, cube_only: 0.4, one_hand_only: 0.4}
  out_of_view_z_m: 10.0       # what a sparse scene leaves out waits up here, above anything a camera can see
  random_hand:
    palm_above_table_m: [0.025, 0.30]   # 0.025 is an open hand lying flat
    curls_together:           # one random amount per finger: 0 = straight, 1 = each joint at its upper limit
      first:  [FFJ3, FFJ2, FFJ1]
      middle: [MFJ3, MFJ2, MFJ1]
      ring:   [RFJ3, RFJ2, RFJ1]
      little: [LFJ3, LFJ2, LFJ1]
      thumb:  [THJ2, THJ1]
    spread: [FFJ4, MFJ4, RFJ4, LFJ4]    # sideways finger joints get this fraction of their range,
    spread_fraction: 0.3                # so neighbouring fingers rarely cross
    # every other joint (thumb base, palm fold, wrist) gets its own angle from its whole range

look:
  skin:
    materials: [right/black, right/gray, right/metallic, left/black, left/gray, left/metallic]
    geoms: [right/rh_forearm, left/lh_forearm]
    tones:                    # the ten tones of the Monk Skin Tone scale, light to dark (typed from memory)
      - [0.965, 0.929, 0.894]
      - [0.953, 0.906, 0.859]
      - [0.969, 0.918, 0.816]
      - [0.918, 0.855, 0.729]
      - [0.843, 0.741, 0.588]
      - [0.627, 0.494, 0.337]
      - [0.510, 0.361, 0.263]
      - [0.376, 0.255, 0.204]
      - [0.227, 0.192, 0.165]
      - [0.161, 0.141, 0.125]
    shade_jitter: 0.04        # each colour channel of the tone moves by up to this much
  backdrop_px: 64             # what shows past the floor fades between two random colours instead of being black
  surfaces:                   # the table and the floor each get any colour, plain or with a pattern made here
    patterns: {plain: 0.4, checks: 0.15, stripes: 0.15, speckle: 0.15, fade: 0.15}
    texture_px: 256
    check_pairs_across: [1, 4]          # pairs of squares across one repeat of the pattern
    stripe_pairs_across: [1, 6]
    speckle_dots_across: [16, 32, 64]   # each must divide texture_px
    speckle_dot_share: [0.05, 0.4]      # part of the surface covered by dots
    repeats: [1, 6]           # how many times the pattern repeats across the surface
  lights:
    count: [1, 3]
    distance_m: [1.5, 3.0]    # from the middle of the table top
    height_deg: [30, 90]
    total_brightness: [0.4, 0.9]        # shared out between the lights at random
    parallel_rays_chance: 0.5           # sunlight-like; otherwise a lamp with a cone of light
    fill_brightness: [0.1, 0.3]         # light that comes from wherever the camera is, so nothing is pitch black
    ambient: [0.1, 0.3]
  extras:                     # objects with no label
    count: [0, 5]
    shapes: [box, ball, cylinder, capsule]
    size_m: [0.02, 0.15]      # every outer dimension
    beside_chance: 0.5        # how often one is put next to the cube or a hand instead of anywhere on the table
    beside_within_m: 0.10
    place_tries: 20           # tries for a spot beside a target (on the table, sunk into nothing) before it goes anywhere
    cube_like_side_m: [0.03, 0.08]      # a box with every side in this range is never red-like:
    red_like: {hue_within_deg: 30, min_saturation: 0.4, min_value: 0.25}   # it would be a cube and need a label
