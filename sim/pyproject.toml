[project]
name = "sim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.17.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "pyzmq>=27.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"sim" = "."}
packages = ["sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
