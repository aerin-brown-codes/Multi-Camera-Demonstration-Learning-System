[project]
name = "detect"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "feed",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "ultralytics>=8.4.211",
]

[tool.uv.sources]
feed = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
